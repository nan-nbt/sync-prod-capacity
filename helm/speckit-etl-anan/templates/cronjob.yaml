apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sync-production-capacity.cronjobName" . }}
  labels:
    app.kubernetes.io/name: {{ include "sync-production-capacity.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.cronJob.schedule | quote }}
  # Transfers must be explicitly triggered, never scheduled by Argo CD sync.
  suspend: true
  successfulJobsHistoryLimit: {{ .Values.cronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronJob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "sync-production-capacity.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/managed-by: {{ .Release.Service }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
          securityContext: {{ .Values.podSecurityContext | toJson }}
          containers:
            - name: {{ include "sync-production-capacity.name" . }}
              image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              resources: {{ .Values.resources | toJson }}
              args:
                - "--days=30"
              securityContext: {{ .Values.containerSecurityContext | toJson }}
              volumeMounts:
                - name: database-env
                  mountPath: /app/.env
                  subPath: .env
                  readOnly: true
          volumes:
            - name: database-env
              secret:
                secretName: {{ required "databaseSecret.name is required" .Values.databaseSecret.name | quote }}
                items:
                  - key: {{ required "databaseSecret.key is required" .Values.databaseSecret.key | quote }}
                    path: .env
