image:
  repository: pcggit-registry.pouchen.com/pci-dev-ai/training/speckit-etl-anan
  tag: "951191c5cc79f88ee06a58c8146af884e60a59a1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: speckit-etl-anan-registry-pull

cronJob:
  # A suspended CronJob is deployed as a template; it never starts transfers.
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Provision this Secret out-of-band in the release namespace. Its selected key
# must contain one complete .env file with all four required POSTGRES_* settings.
databaseSecret:
  name: speckit-etl-anan-db-config
  key: .env

# Security contexts are configurable. Confirm compatibility with QAS policy and
# the image before triggering a Job; do not weaken them without approval.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
