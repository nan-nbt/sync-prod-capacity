installed:
  - branch-convention
  - agent-context
  - brownfield
  - talend
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
    - extension: branch-convention
      command: node .specify/extensions/branch-convention/scripts/create-branch-from-feature.mjs --json
      enabled: true
      optional: false
      prompt: Create/switch to a branch that follows branch-convention.yml?
      description: Create or switch to a convention-compliant Git branch after /speckit.specify writes the feature directory
      condition: null
    - extension: agent-context
      command: speckit.agent-context.update
      enabled: true
      optional: true
      priority: 10
      prompt: Execute speckit.agent-context.update?
      description: Refresh agent context after specification
      condition: null
  after_plan:
    - extension: agent-context
      command: speckit.agent-context.update
      enabled: true
      optional: true
      priority: 10
      prompt: Execute speckit.agent-context.update?
      description: Refresh agent context after planning
      condition: null
  after_implement: null
  after_init:
    - extension: brownfield
      command: speckit.brownfield.scan
      enabled: true
      optional: true
      prompt: Scan this existing project to customize spec-kit configuration?
      description: Auto-scan project after spec-kit init to detect tech stack and conventions
      condition: null
